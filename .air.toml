root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "tpl", "tmpl", "html", "css", "js"]
  exclude_dir = ["tmp", "docs", "vendor", ".git"]
  include_dir = ["cmd", "internal", "pkg"]
  delay = 200
  log = "false"

[[watch]]
  dir = "cmd"
  include = ["*.go", "*.tpl", "*.tmpl", "*.html", "*.css", "*.js"]

[[watch]]
  dir = "internal"
  include = ["*.go", "*.tpl", "*.tmpl"]

[[watch]]
  dir = "pkg"
  include = ["*.go"]

[[watch]]
  dir = "."
  include = [".env"]

[log]
  time = true

[color]
  main = "yellow"
  watcher = "cyan"
  runner = "green"
  build = "magenta"
  test = "blue"
