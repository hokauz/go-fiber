app = "go-fiber-api"
primary_region = "gru"

[build]
  dockerfile = "infra/Dockerfile"

[env]
  PORT = "8080"
  APP_ENV = "production"
  METRICS_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  path = "/api/livez"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"

[metrics]
  port = 9090
  path = "/metrics"

[[vm]]
  memory = "256mb"
  cpus = 1
  memory_mb = 256
