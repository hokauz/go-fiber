services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  test-runner:
    image: ${E2E_IMAGE:-go-fiber-test-runner}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SOURCE_DIR: /source
      WORKSPACE_DIR: /workspace/api
      API_BASE_URL: http://127.0.0.1:8080
      E2E_VERBOSE: ${E2E_VERBOSE:-}
      DB_URL: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    volumes:
      - .:/source:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: ["/workspace/scripts/e2e-run.sh"]

volumes:
  go-mod-cache:
    name: go-fiber-mod-${WORKTREE_ID:-local}
  go-build-cache:
    name: go-fiber-build-${WORKTREE_ID:-local}
